# ---------- Server ----------
server.port=${PORT:8080}

# ---------- MySQL ----------
# createDatabaseIfNotExist=true creates the "queueless" database on first run.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/queueless?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Tables are created and updated automatically from the entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- QueueLess ----------
# Time zone used to decide what "today" means for token numbers (change to your campus time zone).
queueless.timezone=${APP_TIMEZONE:Asia/Kolkata}
queueless.opening-hour=${OPENING_HOUR:9}
queueless.closing-hour=${CLOSING_HOUR:18}

# Comma separated list of front-end origins allowed to call the API (only needed if React is hosted separately).
queueless.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT: use a long random value (32+ characters) in production.
queueless.jwt.secret=${JWT_SECRET:queueless-dev-secret-change-this-before-deploying-1234567890}
queueless.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# First admin account, created automatically if it does not exist.
queueless.admin.name=${ADMIN_NAME:Campus Admin}
queueless.admin.email=${ADMIN_EMAIL:admin@queueless.edu}
queueless.admin.password=${ADMIN_PASSWORD:Admin@123}

# Seeds a demo student and two weeks of sample history so "Best time to visit" works immediately.
# (The sample counters are always created when the services table is empty.)
# Set SEED_DEMO_DATA=false in production.
queueless.seed.demo-data=${SEED_DEMO_DATA:true}

# The React build is served by WebConfig (with a fallback to index.html for client-side routes).
spring.web.resources.add-mappings=false
